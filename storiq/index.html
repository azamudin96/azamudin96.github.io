function pageReports(){const cat=Array.from(new Set(db.products.map(p=>p.category)));let vals=cat.map(c=>db.products.filter(p=>p.category===c).reduce((n,p)=>n+stock(p),0)),total=Math.max(1,vals.reduce((a,b)=>a+b,0));let pal=['#315df1','#8ba8ed','#bfd0f8','#dae3f7','#e9eef6'];let progress=0;const segments=cat.map((c,i)=>{let a=progress;progress+=vals[i]/total*100;return `${pal[i%pal.length]} ${a.toFixed(2)}% ${progress.toFixed(2)}%`}).join(',');const last7=Array.from({length:7},(_,i)=>{let date=new Date();date.setHours(12,0,0,0);date.setDate(date.getDate()-(6-i));let ds=date.toISOString().slice(0,10);return {label:new Intl.DateTimeFormat('en-MY',{weekday:'short'}).format(date),n:db.movements.filter(m=>m.at.slice(0,10)===ds).length}});const mx=Math.max(1,...last7.map(d=>d.n));return `${header('REPORTS / PERFORMANCE','See the full picture.','Actionable stock summaries, movement activity and replenishment signals.',`<button class="btn primary" data-action="export">${ic('download',15)} Download movements CSV</button>`)}<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><span class="stat-label">Total stock on hand</span><div><div class="stat-num">${fmt(totalUnits())}</div><div class="stat-foot">Across ${WHS.length} warehouses</div></div></div><div class="stat"><span class="stat-label">Serialized units on hand</span><div><div class="stat-num">${fmt(db.units.filter(u=>u.status==='IN_STOCK').length)}</div><div class="stat-foot">Individually traceable</div></div></div><div class="stat"><span class="stat-label">Products below min. level</span><div><div class="stat-num">${lowProducts().length}</div><div class="stat-foot">Replenishment candidates</div></div></div></div><div class="reports-top"><div class="panel panel-pad"><div class="panel-title"><div><h3>Movement volume</h3><p>Transaction count in the past seven days</p></div><span class="pill bulk">Last 7 days</span></div><div class="chart-wrap">${last7.map(d=>`<div class="chart-col"><div title="${d.n} movements" class="chart-bar" style="height:${Math.max(4,d.n/mx*100)}%"></div><span class="chart-label">${d.label}</span></div>`).join('')}</div><div class="fine-print" style="margin-top:35px">Includes all stock transaction types in this demo workspace.</div></div><div class="panel panel-pad"><div class="panel-title"><div><h3>Category distribution</h3><p>By number of units on hand</p></div></div><div class="ring-wrap"><div class="ring" style="background:conic-gradient(${segments})"><div class="ring-hole"><div><strong>${fmt(totalUnits())}</strong><br><span>units in stock</span></div></div></div><div class="ring-legend">${cat.map((c,i)=>`<div class="ll"><span><i class="dot" style="background:${pal[i%pal.length]}"></i>${esc(c)}</span><strong>${Math.round(vals[i]/total*100)}%</strong></div>`).join('')}</div></div></div></div><div class="panel panel-pad"><div class="panel-title"><div><h3>Replenishment watch</h3><p>Products currently below their minimum stock levels</p></div><button class="quiet-link" data-action="page" data-page="inventory">View all inventory ${ic('chevron',13)}</button></div><div class="table-scroll" style="margin-top:17px"><table class="tbl"><thead><tr><th>Product</th><th>On hand</th><th>Minimum</th><th>Shortfall</th><th>Status</th></tr></thead><tbody>${lowProducts().map(p=>`<tr><td><div class="product-cell">${productIcon(p,16)}<div><div class="prod-name">${esc(p.name)}</div><div class="sku">${esc(p.sku)}</div></div></div></td><td><strong>${fmt(stock(p))}</strong></td><td>${p.min}</td><td class="negative">${fmt(p.min-stock(p))}</td><td>${status(p)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No low-stock products.</div></td></tr>'}</tbody></table></div></div>${footer()}`}
function pageTeam(){return `${header('ACCESS / WORKSPACE','The right access. For everyone.','A preview of permission management; invitations are not sent in this demo.',`<button class="btn primary" data-action="invite">${ic('plus',15)} Invite team member</button>`)}<div class="panel"><div class="table-scroll"><table class="tbl"><thead><tr><th>Team member</th><th>Role</th><th>Location access</th><th>Status</th></tr></thead><tbody>${[['Sarah Lim','sarah@example.com','Admin','All warehouses','SL'],['Adam Firdaus','adam@example.com','Warehouse Manager','All warehouses','AF'],['Nabila Rahman','nabila@example.com','Staff','Main Warehouse','NR'],['Ryan Ong','ryan@example.com','Viewer','KL Distribution','RO']].map((r,i)=>`<tr><td><div class="product-cell"><div class="avatar" style="background:${['#e5ebfa','#eef5e8','#f7e8f2','#eaf5f7'][i]};color:#576c93">${r[4]}</div><div><div class="prod-name">${r[0]}</div><div class="sku" style="font-family:inherit">${r[1]}</div></div></div></td><td><span class="pill ${i===0?'serial':'bulk'}">${r[2]}</span></td><td>${r[3]}</td><td><span class="pill healthy">Active</span></td></tr>`).join('')}</tbody></table></div></div><div class="panel panel-pad section-gap"><div class="panel-title"><div><h3>Role permissions (MVP proposal)</h3><p>Server-side verification is required in production</p></div></div><div class="table-scroll" style="margin-top:15px"><table class="tbl"><thead><tr><th>Permission</th><th>Admin</th><th>Manager</th><th>Staff</th><th>Viewer</th></tr></thead><tbody>${[['View inventory',1,1,1,1],['Stock in / out',1,1,1,0],['Transfers & stock count',1,1,0,0],['Adjustments',1,1,0,0],['Manage products',1,1,0,0],['Manage users',1,0,0,0]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td style="color:${v?'#208c6e':'#bcc6d2'}">${ic(v?'check':'minus',17)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>${footer()}`}

>`<div class="serial-row"><div><strong>${esc(u.serial)}</strong><div class="sku">${esc(getWh(u.warehouse)?.name||'—')}</div></div><button class="btn sm iconbtn" data-action="label-unit" data-pid="${p.id}" data-uid="${u.id}" title="View unit QR">${ic('scan',14)}</button></div>`).join('')}${inStock.length>8?`<p class="fine-print">Showing 8 of ${inStock.length} units</p>`:''}</div>`:''}<div class="detail-block" style="border:0"><h4>Recent movements</h4>${movements.map(m=>`<div class="activity-row"><div class="activity-icon ${m.type.toLowerCase()}">${ic(moveIcon(m.type),14)}</div><div class="activity-mid"><strong>${esc(m.type)} · ${esc(m.by)}</strong><span>${shortdt(m.at)}</span></div><strong class="activity-qty">${qtyText(m)}</strong></div>`).join('')||'<div class="fine-print">No recent movements for this product.</div>'}</div></div>`}
function txnModalHtml(){let t=ui.txn;let p=getP(t.productId)||db.products[0];if(!p)return '';const type=t.type||'IN';let allowed=unitsOf(p.id,type==='IN'?'all':t.from||'W1');let whOpts=()=>WHS.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');return `<div class="overlay" data-action="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="New stock transaction"><div class="modal-head"><div><div class="eyebrow">RECORD AN INVENTORY MOVEMENT</div><h2>New stock transaction</h2><p>Complete details, review and confirm.</p></div><button class="btn iconbtn" data-action="modal-close">${ic('x',16)}</button></div><form id="txnForm"><div class="modal-body"><div class="txn-choices">${[['IN','arrowdown','Stock in'],['OUT','arrowup','Stock out'],['TRANSFER','arrows','Transfer'],['ADJUST','edit','Adjust']].map(([v,i,l])=>`<button type="button" class="txn-choice ${type===v?'active':''}" data-action="txn-type" data-type="${v}">${ic(i,20)}${l}</button>`).join('')}</div><div class="field"><label>Product / SKU</label><select id="txn-product" name="productId">${db.products.map(x=>`<option value="${x.id}" ${p.id===x.id?'selected':''}>${esc(x.name)} · ${esc(x.sku)}</option>`).join('')}</select></div><div class="form-info"><div style="color:var(--blue)">${ic('package',17)}</div><p>${modeBadge(p)} &nbsp; <strong>${fmt(stock(p))} ${esc(p.unit)}</strong> total on hand · ${esc(p.sku)}</p></div><div class="form-cols"><div class="field" ${type==='IN'?'style="display:none"':''}><label>${type==='TRANSFER'?'From warehouse':'Warehouse'}</label><select id="txn-from" name="from">${WHS.map(w=>`<option value="${w.id}" ${t.from===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field" ${type==='OUT'||type==='ADJUST'?'style="display:none"':''}><label>${type==='TRANSFER'?'Destination warehouse':'Warehouse receiving'}</label><select id="txn-to" name="to">${WHS.map(w=>`<option value="${w.id}" ${t.to===w.id?'selected':''}>${esc(w.name)}</option function mobileHome(){let m=allMovements().slice(0,3);return `<div class="mob-pad"><div class="mob-greeting">GOOD TO SEE YOU, SARAH</div><h1 class="mob-title" style="font-size:27px;margin-top:8px">Ready for your shift?</h1><p class="mob-sub">Keep every item moving, without the paperwork.</p><button class="mob-location" style="width:100%;text-align:left" data-action="mobile-warehouses"><div><small>CURRENT LOCATION</small><strong>${esc(getWh(ui.mobileWarehouse)?.name)}</strong></div><span style="color:#8495af">${ic('down',15)}</span></button><div class="mob-actions">${[['IN','arrowdown','Stock In','Receive items'],['OUT','arrowup','Stock Out','Issue items'],['TRANSFER','arrows','Transfer','Move between sites'],['COUNT','clipboard','Stock Count','Verify quantities']].map(([v,i,n,sub])=>`<button class="mob-action" data-action="mobile-action" data-type="${v}"><span class="mob-aico">${ic(i,19)}</span><strong>${n}</strong><small>${sub}</small></button>`).join('')}</div><div class="mob-balance"><div><small>YOUR WAREHOUSE INVENTORY</small><strong>${fmt(totalUnits(ui.mobileWarehouse))}</strong><small>units across ${db.products.filter(p=>stock(p,ui.mobileWarehouse)>0).length} SKUs</small></div><span style="opacity:.9">${ic('warehouse',31)}</span></div><div class="mob-section-title"><span>Recent movements</span><button class="quiet-link" data-action="mobile-nav" data-screen="activity">See all ${ic('chevron',12)}</button></div>${m.map(x=>{let p=getP(x.productId);return `<div class="mob-recent"><div class="activity-icon ${x.type.toLowerCase()}" style="height:30px;width:30px">${ic(moveIcon(x.type),14)}</div><div style="flex:1;min-width:0"><strong class="trunc">${esc(p?.name||'Product')}</strong><span>${esc(x.type)} · ${shortdt(x.at)}</span></div><strong class="${x.type==='IN'?'positive':x.type==='OUT'?'negative':''}" style="font-size:11px">${qtyText(x)}</strong></div>`}).join('')}</div>`}
function mobileScan(){let samples=['P-101','P-105','P-102','P-108','P-107'].map(getP).filter(Boolean);return `<div class="mob-pad" style="padding-bottom:7px">${mobHeader(ui.mobileAction==='COUNT'?'Scan for stock count':`Scan to ${ui.mobileAction==='IN'?'receive stock':ui.mobileAction==='OUT'?'issue stock':'transfer stock'}`,'Point your camera at a QR label or select a sample below.')}</div><div class="scan-card"><button class="scan-camera-btn" data-action="mobile-camera">${ic('scan',14)} Use camera</button><div class="scan-corners"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div><div class="scan-text">Align QR label inside the frame</div></div><div class="mob-pad"><div class="mob-section-title"><span>Tap a demo QR to simulate scan</span>${ic('spark',15)}</div><div class="fine-print" style="margin-bottom:11px">No camera needed to experience the complete workflow.</div>${samples.map(p=>`<button class="scan-quick-item" data-action="mobile-select" data-id="${p.id}">${productIcon(p,17)}<div style="flex:1;min-width:0"><strong class="trunc">${esc(p.name)}</strong><span>${esc(p.sku)} · ${p.mode==='BULK'?'Bulk':'Serial'}</span></div>${ic('chevron',15)}</button>`).join('')}</div>`}
function mobileForm(){let p=getP(ui.mobileProduct)||db.products[0];let act=ui.mobileAction;let wh=ui.mobileWarehouse;let unitList=unitsOf(p.id,wh),unit=unitList[0];const whopts=(selected)=>WHS.map(w=>`<option value="${w.id}" ${selected===w.id?'selected':''}>${esc(w.name)}</option>`).join('');return `<div class="mob-pad">${mobHeader(act==='IN'?'Receive stock':act==='OUT'?'Issue stock':act==='TRANSFER'?'Transfer stock':'Count inventory','Review the product and enter the transaction details.')}<div style="display:flex;align-items:center;gap:10px;margin:19px 0 9px">${productIcon(p,25)}<div style="flex:1;min-width:0"><strong style="font-size:12px;display:block;margin-bottom:4px">${esc(p.name)}</strong><span style="font-size:10px;color:#98a5b7">${esc(p.sku)} · ${p.mode==='BULK'?'Bulk SKU':'Serialized unit'}</span></div></div><div class="mob-form-balance"><div><small>${act==='COUNT'?'SYSTEM QUANTITY':'AVAILABLE AT LOCATION'}</small><strong>${fmt(stock(p,wh))} <span style="font-size:12px;color:#a0acbc">${esc(p.unit)}</span></strong></div><span style="color:#637fae">${ic('package',22)}</span></div><form id="mobileTxnForm"><input type="hidden" name="productId" value="${p.id}"/><input type="hidden" name="type" value="${act}"/><div class="field"><label>${act==='IN'?'Receiving warehouse':act==='TRANSFER'?'Source warehouse':'Warehouse'}</label><select id="mobwh" name="from">${whopts(wh)}</select></div>${act==='TRANSFER'?`<div class="field"><label>Destination</label><select name="to">${whopts(wh==='W1'?'W2':'W1')}</select></div>`:''}${p.mode==='BULK'?`<div class="field"><label>${act==='COUNT'?'Counted quantity':'Quantity'}</label><input required name="qty" type="number" min="${act==='COUNT'?'0':'1'}" step="1" value="${act==='COUNT'?stock(p,wh):1}"/></div>`:act==='COUNT'?`<div class="form-info">${ic('alert',18)}<p>Serialized units are counted individually. Use the stock list to check unit status. Quantity-based counts are not available.</p></div>`:act==='IN'?`<div class="field"><label>New serial number</label><input name="serial" required placeholder="e.g. SN-2026-089" /></div>`:`<div class="field"><label>Serial unit</label><select name="unitId" required>${unitList.length?unitList.map(u=>`<option value="${u.id}" ${ui.mobileUnit===u.id?'selected':''}>${esc(u.serial)}</option>`).join(''):'<option value="">No units available here</option>'}</select></div>`}<div class="field"><label>Reference / remarks</label><textarea name="note" placeholder="Optional note, delivery order, reason..."></textarea></div><button class="mob-submit" type="submit" ${p.mode==='SERIALIZED'&&act==='COUNT'?'disabled':''}>${ic('check',16)} &nbsp; Confirm ${act==='IN'?'Stock In':act==='OUT'?'Stock Out':act==='TRANSFER'?'Transfer':'Stock Count'}</button><div class="fine-print" style="text-align:center;margin-top:12px">This is a local prototype. No live server involved.</div></form></div>`}
function mobileSuccess(){const m=ui.mobileLast;let p=getP(m?.productId);return `<div class="mob-success"><div class="success-icon">${ic('check',38)}</div><h2>Stock updated!</h2><p>Your ${m?.type==='IN'?'stock receipt':m?.type==='OUT'?'stock issue':m?.type==='TRANSFER'?'transfer':'stock adjustment'} was recorded. The web dashboard has been updated too.</p><div class="success-summary"><div class="line"><span>Transaction ID</span><strong>${esc(m?.id||'')}</strong></div><div class="line"><span>Product</span><strong style="max-width:160px;text-align:right">${esc(p?.name||'')}</strong></div><div class="line"><span>Movement</span><strong>${m?.type==='OUT'?'−':m?.type==='IN'?'+':''}${fmt(Math.abs(m?.qty||0))} ${esc(p?.unit||'')}</strong></div><div class="line"><span>New on-hand balance</span><strong>${fmt(stock(p,ui.mobileWarehouse))}</strong></div><div class="line"><span>Time</span><strong>${m?.at?shortdt(m.at):'—'}</strong></div></div><button class="mob-submit" data-action="mobile-again">${ic('scan',16)} &nbsp; Scan another item</button><button class="btn block" style="margin-top:10px" data-action="mobile-home">Return home</button></div>`}
function mobileInventory(){return `<div class="mob-pad"><div class="mob-greeting">YOUR CATALOGUE</div><h2 class="mob-title">Inventory</h2><p class="mob-sub">${fmt(db.products.length)} tracked products · ${esc(getWh(ui.mobileWarehouse)?.name)}</p><div class="mob-location"><div><small>AVAILABLE ON SITE</small><strong>${fmt(totalUnits(ui.mobileWarehouse))} units</strong></div>${ic('package',20)}</div><div class="mob-section-title"><span>Products</span><span style="color:#9aa7b7;font-size:10px">${db.products.length} SKUs</span></div>${db.products.map(p=>`<button class="scan-quick-item" data-action="mobile-detail" data-id="${p.id}">${productIcon(p,17)}<div style="flex:1;min-width:0"><strong class="trunc">${esc(p.name)}</strong><span>${esc(p.sku)} · ${p.mode==='BULK'?'Bulk':'Serial'}</span></div><div style="text-align:right"><strong style="display:block;font-size:12px">${fmt(stock(p,ui.mobileWarehouse))}</strong><span>${esc(p.unit)}</span></div></button>`).join('')}</div>`}
function mobileDetail(){let p=getP(ui.mobileProduct)||db.products[0];return `<div class="mob-pad">${mobHeader('Product detail','QR identity and live availability.')}<div style="background:#f4f7fc;border-radius:13px;display:grid;place-items:center;padding:25px;margin:16px 0">${productIcon(p,48)}</div><div class="eyebrow">${esc(p.sku)} / ${esc(p.category)}</div><h2 style="font-size:19px;margin:8px 0">${esc(p.name)}</h2><div style="display:flex;gap:6px">${modeBadge(p)}${status(p,ui.mobileWarehouse)}</div><div class="mob-form-balance"><div><small>ON HAND IN THIS WAREHOUSE</small><strong>${fmt(stock(p,ui.mobileWarehouse))} <span style="font-size:11px">${esc(p.unit)}</span></strong></div>${ic('package',22)}</div><div style="display:flex;justify-content:center;padding:15px"><img src="${QR_DATA[p.id]||''}" style="width:110px;height:110px" alt="Product QR" /></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px"><button class="btn primary" data-action="mobile-act-product" data-type="IN" data-id="${p.id}">${ic('arrowdown',14)} Stock In</button><button class="btn" data-action="mobile-act-product" data-type="OUT" data-id="${p.id}">${ic('arrowup',14)} Stock Out</button></div></div>`}
function mobileActivity(){return `<div class="mob-pad"><div class="mob-greeting">YOUR OPERATIONS</div><h2 class="mob-title">Movement history</h2><p class="mob-sub">A clear trace for every stock change.</p><div style="margin-top:25px">${allMovements().slice(0,22).map(m=>{const p=getP(m.productId);return `<div class="mob-recent"><div class="activity-icon ${m.type.toLowerCase()}">${ic(moveIcon(m.type),14)}</div><div style="min-width:0;flex:1"><strong class="trunc">${esc(p?.name||'Product')}</strong><span>${m.type} · ${shortdt(m.at)}</span></div><strong style="font-size:11px" class="${m.type==='IN'?'positive':m.type==='OUT'?'negative':''}">${qtyText(m)}</strong></div>`}).join('')}</div></div>`}
function phoneHtml(){let screen=({home:mobileHome,scan:mobileScan,form:mobileForm,success:mobileSuccess,inventory:mobileInventory,detail:mobileDetail,activity:mobileActivity})[ui.mobileScreen]||mobileHome;return `<div class="phone-frame">${phoneTop()}<div class="phone-inner">${screen()}</div>${phoneNav()}</div>`}
function mobileHtml(){return `<div class="mobile-shell"><div class="mobile-scrim" data-action="mobile-close"></div><div class="mobile-panel"><div class="mobile-panel-header"><div><h3>Mobile app · Interactive demo</h3><p>Android & iOS flow preview · Tap to explore</p></div><button class="btn iconbtn" data-action="mobile-close" aria-label="Close mobile preview">${ic('x',17)}</button></div>${phoneHtml()}<div class="mobile-phone-note">Simulated app interface · linked to the admin demo inventory</div></div></div>`}
function renderLayers(){document.querySelector('#layer-root').innerHTML=(ui.detail?detailHtml():'')+(ui.modal?(ui.modal==='txn'?txnModalHtml():ui.modal==='product'?prodModalHtml():inviteHtml()):'')+(ui.mobileOpen?mobileHtml():'')}
function toast(msg,error=false){let el=document.createElement('div');el.className='toast'+(error?' error':'');el.innerHTML=`${ic(error?'alert':'checkcircle',18)}<span>${esc(msg)}</span>`;document.querySelector('#toast-root').append(el);setTimeout(()=>el.remove(),3700)}
function getTransResult(d){let n=structuredClone(db),p=n.products.find(x=>x.id===d.productId);if(!p)throw Error('Select a valid product.');let type=d.type==='COUNT'?'ADJUST':d.type;let from=d.from||'W1',to=d.to||'W1';if(!['IN','OUT','TRANSFER','ADJUST'].includes(type))throw Error('Invalid movement type.');if(!WHS.some(w=>w.id===from)||!WHS.some(w=>w.id===to))throw Error('Select a valid warehouse.');if(type==='TRANSFER'&&from===to)throw Error('Source and destination warehouses must be different.');let q=Number(d.qty),mQty=1,unit=null;if(p.mode==='BULK'){if(!Number.isSafeInteger(q)||q<0)throw Error('Enter a valid whole-number quantity.');if(type!=='ADJUST'&&q<1)throw Error('Quantity must be at least 1.');if(type==='IN'){p.stocks[to]=(p.stocks[to]||0)+q;mQty=q}else if(type==='OUT'){if((p.stocks[from]||0)<q)throw Error(`Insufficient stock. Only ${p.stocks[from]||0} available at source.`);p.stocks[from]-=q;mQty=q}else if(type==='TRANSFER'){if((p.stocks[from]||0)<q)throw Error(`Insufficient stock for transfer (${p.stocks[from]||0} available).`);p.stocks[from]-=q;p.stocks[to]=(p.stocks[to]||0)+q;mQty=q}else{mQty=q-(p.stocks[from]||0);p.stocks[from]=q}}else{if(type==='ADJUST')throw Error('Serialized units require individual tracking. Use stock in/out/transfer.');if(type==='IN'){let serial=String(d.serial||'').trim();if(serial.length<3)throw Error('Enter a serial number of at least 3 characters.');if(n.units.some(u=>u.serial.toLowerCase()===serial.toLowerCase()))throw Error('Serial number already exists.');if(n.nextUnit>1150)throw Error('Demo unit ID limit reached. Reset demo to continue.');let uid=`U-${n.nextUnit++}`;unit={id:uid,productId:p.id,serial,warehouse:to,status:'IN_STOCK'};n.units.push(unit)}else{unit=n.units.find(u=>u.id===d.unitId);if(!unit||unit.productId!==p.id||unit.status!=='IN_STOCK'||unit.warehouse!==from)throw Error('Select an available unit from the source warehouse.');if(type==='OUT'){unit.warehouse=null;unit.status='ISSUED'}else{unit.warehouse=to}}mQty=1}
let at=new Date().toISOString(),m={id:`MV-${String(n.seq++).padStart(5,'0')}`,type,productId:p.id,qty:mQty,from:type==='IN'?null:from,to:type==='OUT'||type==='ADJUST'?null:to,unitId:unit?.id||null,serial:unit?.serial||null,note:String(d.note||'').trim().slice(0,180),by:d.by||'Sarah',at};n.movements.push(m);db=n;save();return m}
function resetDemo(){db=makeStarter();save();ui.page='overview';ui.q='';ui.wh='all';ui.cat='all';ui.mode='all';ui.detail=null;ui.modal=null;ui.mobileOpen=false;ui.mobileScreen='home';ui.mobileWarehouse='W1';ui.labelProduct='P-101';ui.labelUnit='';render();toast('Sample inventory restored to its original state.')}
function openTxn(pid,type){ui.detail=null;ui.modal='txn';ui.txn={type:type||'IN',productId:pid||db.products[0].id,from:ui.wh!=='all'?ui.wh:'W1',to:'W2'};renderLayers()}
function doExport(){let rows=[['Transaction ID','Timestamp','Type','SKU','Product','Quantity','From','To','Serial','Operator','Notes'],...allMovements().map(m=>{let p=getP(m.productId);return[m.id,m.at,m.type,p?.sku||'',p?.name||'',m.qty,getWh(m.from)?.name||'',getWh(m.to)?.name||'',m.serial||'',m.by,m.note||'']})];const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='storiq-stock-movements.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Movement report exported as CSV.')}
function createProduct(data){let name=String(data.get('name')||'').trim(),sku=String(data.get('sku')||'').trim().toUpperCase(),mode=String(data.get('mode')||'');let min=Number(data.get('min'));if(name.length<3||sku.length<3)throw Error('Enter a valid name and SKU.');if(db.products.some(x=>x.sku.toUpperCase()===sku))throw Error('SKU already exists.');if(!['BULK','SERIALIZED'].includes(mode))throw Error('Invalid tracking mode.');if(!Number.isSafeInteger(min)||min<0)throw Error('Minimum stock must be a valid positive number.');if(db.nextProduct>159)throw Error('Demo product ID capacity reached. Reset demo to continue.');let id=`P-${db.nextProduct++}`,palette=[['#e9eef8','#677eb1'],['#eaf2eb','#648d7a'],['#f4ebdf','#a18364']],color=palette[(db.products.length+1)%3];db.products.push({id,sku,name,category:String(data.get('category')||'Other'),mode,unit:String(data.get('unit')||'pcs').trim()||'pcs',min,stocks:{W1:0,W2:0,W3:0},color:color[0],tone:color[1],symbol:mode==='SERIALIZED'?'scan':'package'});save();return id}
function startCam(){let view=document.querySelector('.scan-card');if(!view)return;if(!navigator.mediaDevices?.getUserMedia){toast('Camera unavailable here. Tap a sample QR below.',true);return;}let placeholder=view.innerHTML;view.innerHTML=`<video id="cameraVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div class="scan-corners" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div><button class="scan-camera-btn" data-action="mobile-stop-camera">Stop camera</button><div class="scan-text" style="z-index:1">Point at a Storiq QR label</div>`;navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(stream=>{window._storiqCam=stream;let video=document.querySelector('#cameraVideo');if(!video){stream.getTracks().forEach(t=>t.stop());return}video.srcObject=stream;video.play().catch(()=>{});if(!('BarcodeDetector' in window)){toast('Live decoding not supported in this browser. Use demo QR selection.',true);return;}let detector=new BarcodeDetector({formats:['qr_code']});const tick=async()=>{if(!window._storiqCam||!document.querySelector('#cameraVideo'))return;try{if(video.readyState>=2){let codes=await detector.detect(video);for(let c of codes){let txt=c.rawValue||'',z=txt.split(':'),p=null;if(z.length===3&&z[0]==='STORIQ'){if(z[1]==='PRODUCT')p=getP(z[2]);if(z[1]==='UNIT'){let u=db.units.find(v=>v.id===z[2]);p=getP(u?.productId);if(u?.warehouse)ui.mobileWarehouse=u.warehouse;ui.mobileUnit=u?.id||null;}if(p){stopCam();ui.mobileProduct=p.id;ui.mobileScreen='form';renderLayers();toast('QR scanned: '+p.name);return;}}}}}catch{}window._storiqFrame=requestAnimationFrame(tick)};window._storiqFrame=requestAnimationFrame(tick)}).catch(()=>{view.innerHTML=placeholder;toast('Camera permission denied or unavailable. Use sample QR scanning instead.',true)})}
function stopCam(){cancelAnimationFrame(window._storiqFrame||0);if(window._storiqCam){window._storiqCam.getTracks().forEach(t=>t.stop());window._storiqCam=null}}
function goPage(page){ui.page=page;ui.detail=null;ui.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,type=b.dataset.type;switch(a){case 'page':goPage(b.dataset.page);break;case 'detail':ui.detail=id;renderLayers();break;case 'detail-close':ui.detail=null;renderLayers();break;case 'modal-bg':if(e.target===b){ui.modal=null;renderLayers()}break;case 'modal-close':ui.modal=null;renderLayers();break;case 'txn-open':openTxn(id,type);break;case 'txn-type':ui.txn.type=type;renderLayers();break;case 'product-open':ui.modal='product';renderLayers();break;case 'invite':ui.modal='invite';renderLayers();break;case 'movetype':ui.movementType=b.dataset.value;renderContent();break;case 'whinventory':ui.wh=id;goPage('inventory');break;case 'label-for':ui.labelProduct=id;ui.labelUnit='';goPage('labels');break;case 'label-unit':ui.labelProduct=b.dataset.pid;ui.labelUnit=b.dataset.uid;goPage('labels');break;case 'downloadqr':{const l=labelTarget();if(!l.qr){toast('QR image not available.',true);break}let link=document.createElement('a');link.href=l.qr;link.download=`STORIQ-${l.id}.png`;document.body.append(link);link.click();link.remove();toast('QR image downloaded.');break}case 'print':window.print();break;case 'export':doExport();break;case 'reset':if(confirm('Reset the demo? This will remove sample transactions and products you added.'))resetDemo();break;case 'mobile-open':ui.modal=null;ui.detail=null;ui.mobileOpen=true;ui.mobileScreen='home';renderLayers();break;case 'mobile-close':stopCam();ui.mobileOpen=false;renderLayers();break;case 'mobile-nav':stopCam();ui.mobileScreen=b.dataset.screen;renderLayers();break;case 'mobile-back':stopCam();ui.mobileScreen=ui.mobileScreen==='form'?'scan':ui.mobileScreen==='scan'?'home':ui.mobileScreen==='detail'?'inventory':'home';renderLayers();break;case 'mobile-action':stopCam();ui.mobileAction=type;ui.mobileScreen='scan';renderLayers();break;case 'mobile-select':stopCam();ui.mobileUnit=null;ui.mobileProduct=id;ui.mobileScreen='form';renderLayers();break;case 'mobile-act-product':ui.mobileUnit=null;ui.mobileProduct=id;ui.mobileAction=type;ui.mobileScreen='form';renderLayers();break;case 'mobile-detail':ui.mobileProduct=id;ui.mobileScreen='detail';renderLayers();break;case 'mobile-again':ui.mobileScreen='scan';renderLayers();break;case 'mobile-home':ui.mobileScreen='home';renderLayers();break;case 'mobile-warehouses':{let idx=WHS.findIndex(w=>w.id===ui.mobileWarehouse);ui.mobileWarehouse=WHS[(idx+1)%WHS.length].id;renderLayers();break}case 'mobile-camera':startCam();break;case 'mobile-stop-camera':stopCam();ui.mobileScreen='scan';renderLayers();break;}});
document.addEventListener('change',e=>{const id=e.target.id;switch(id){case 'whfilter':ui.wh=e.target.value;renderContent();break;case 'catfilter':ui.cat=e.target.value;renderContent();break;case 'modefilter':ui.mode=e.target.value;renderContent();break;case 'txn-product':ui.txn.productId=e.target.value;renderLayers();break;case 'txn-from':ui.txn.from=e.target.value;renderLayers();break;case 'txn-to':ui.txn.to=e.target.value;break;case 'labelproduct':ui.labelProduct=e.target.value;ui.labelUnit='';renderContent();break;case 'labelunit':ui.labelUnit=e.target.value;renderContent();break;case 'labelqty':ui.labelQty=Number(e.target.value);renderContent();break;case 'mobwh':ui.mobileWarehouse=e.target.value;renderLayers();break;}});
document.addEventListener('input',e=>{if(e.target.id==='invsearch'){ui.q=e.target.value;let oldpos=e.target.selectionStart;renderContent();let ne=document.querySelector('#invsearch');ne?.focus();ne?.setSelectionRange(oldpos,oldpos)}});
document.addEventListener('submit',e=>{if(!['txnForm','mobileTxnForm','productForm'].includes(e.target.id))return;e.preventDefault();let form=e.target,fd=new FormData(form);try{if(form.id==='productForm'){let pid=createProduct(fd);ui.modal=null;ui.page='inventory';render();ui.detail=pid;renderLayers();toast('Product created with its own QR identity.');return}let isMobile=form.id==='mobileTxnForm',type=isMobile?String(fd.get('type')):ui.txn.type,productId=String(fd.get('productId')||ui.txn.productId),p=getP(productId);let data={type,productId,from:String(fd.get('from')||ui.txn.from||'W1'),to:isMobile&&type==='IN'?String(fd.get('from')):String(fd.get('to')||(type==='IN'?ui.txn.to:'W1')),qty:fd.get('qty'),unitId:String(fd.get('unitId')||''),serial:String(fd.get('serial')||''),note:String(fd.get('note')||''),by:isMobile?'Sarah':'AzariX Admin'};if(isMobile&&type==='COUNT')data.type='ADJUST';if(!isMobile&&type==='IN')data.from=null;if(type==='ADJUST'&&!isMobile)data.to=null;const m=getTransResult(data);if(isMobile){ui.mobileLast=m;ui.mobileScreen='success';render()}else{ui.modal=null;render();toast(`${p.name} · ${type==='IN'?'Stock received':type==='OUT'?'Stock issued':type==='TRANSFER'?'Transfer completed':'Stock adjusted'} successfully.`)}}catch(err){toast(err.message||'Transaction could not be completed.',true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.mobileOpen){stopCam();ui.mobileOpen=false}else if(ui.modal)ui.modal=null;else if(ui.detail)ui.detail=null;renderLayers()}});
render();
