  <script>
  (()=>{
    'use strict';
    const KEY='ruang_booking_demo_v1';
    const stays=[
      {id:'serambi',type:'stay',name:'Villa Serambi',area:'Janda Baik, Pahang',tag:'Pilihan ramai',desc:'Villa peribadi berlatar hijau dengan ruang tamu luas dan kolam santai.',price:480,fee:80,max:8,rooms:3,image:'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1000&q=85&auto=format&fit=crop'},
      {id:'awan',type:'stay',name:'Rumah Awan',area:'Bentong, Pahang',tag:'Untuk keluarga',desc:'Rumah rehat minimalis, sesuai untuk percutian ringkas bersama keluarga.',price:280,fee:50,max:4,rooms:2,image:'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=1000&q=85&auto=format&fit=crop'},
      {id:'senja',type:'stay',name:'Studio Senja',area:'Hulu Langat, Selangor',tag:'Untuk pasangan',desc:'Studio yang tenang dan selesa, dikelilingi cahaya dan kehijauan.',price:190,fee:40,max:2,rooms:1,image:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=1000&q=85&auto=format&fit=crop'}
    ];
    const venues=[
      {id:'teratai',type:'event',name:'Laman Teratai',area:'Janda Baik, Pahang',tag:'Acara istimewa',desc:'Laman terbuka untuk majlis intim, pertunangan dan hari keluarga.',price:1800,max:80,image:'https://images.unsplash.com/photo-1519741497674-611481863552?w=1000&q=85&auto=format&fit=crop'},
      {id:'anggerik',type:'event',name:'Ruang Anggerik',area:'Bentong, Pahang',tag:'Ruang serbaguna',desc:'Ruang berhawa dingin untuk sambutan, bengkel dan gathering kecil.',price:950,max:35,image:'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=1000&q=85&auto=format&fit=crop'}
    ];
    const listings=[...stays,...venues];
    const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const $=(s)=>document.querySelector(s);
    const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=(n)=>new Intl.NumberFormat('ms-MY',{style:'currency',currency:'MYR',minimumFractionDigits:0,maximumFractionDigits:0}).format(n).replace('MYR','RM');
    const localISO=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const parseDate=(s)=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
    const offset=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return localISO(d)};
    const today=()=>localISO(new Date());
    const formatDate=(d,opts={day:'numeric',month:'short',year:'numeric'})=>d?parseDate(d).toLocaleDateString('ms-MY',opts):'—';
    const nights=(a,b)=>Math.round((Date.UTC(...a.split('-').map((v,i)=>i===1?+v-1:+v))-Date.UTC(...b.split('-').map((v,i)=>i===1?+v-1:+v)))/-86400000);
    const uid=()=>`RG-${Date.now().toString(36).slice(-6).toUpperCase()}-${Math.floor(Math.random()*900+100)}`;
    const future=(n)=>offset(today(),n);
    const seed=()=>({bookings:[
      {id:'RG-DEMO101',type:'stay',itemId:'serambi',start:future(4),end:future(6),name:'Nur Amira',phone:'012-000 0101',email:'',guests:6,total:1040,deposit:312,status:'confirmed',created:future(-3),notes:'Check-in petang'},
      {id:'RG-DEMO102',type:'stay',itemId:'awan',start:future(10),end:future(12),name:'Hafiz Rahman',phone:'012-000 0102',email:'',guests:4,total:610,deposit:183,status:'confirmed',created:future(-2),notes:''},
      {id:'RG-DEMO103',type:'stay',itemId:'senja',start:future(12),end:future(14),name:'Sarah Nadia',phone:'012-000 0103',email:'',guests:2,total:420,deposit:126,status:'pending',created:future(-1),notes:''},
      {id:'RG-DEMO104',type:'event',itemId:'teratai',start:future(7),end:future(8),name:'Aisyah Ali',phone:'012-000 0104',email:'',guests:60,total:1800,deposit:540,status:'confirmed',created:future(-4),eventType:'Majlis pertunangan',addons:[],notes:''},
      {id:'RG-DEMO105',type:'event',itemId:'anggerik',start:future(17),end:future(18),name:'Daniel Lim',phone:'012-000 0105',email:'',guests:30,total:950,deposit:285,status:'pending',created:future(-1),eventType:'Majlis hari jadi',addons:[],notes:''}
    ],blocks:[]});
    let db;
    try{db=JSON.parse(localStorage.getItem(KEY)||'null');if(!db||!Array.isArray(db.bookings)||!Array.isArray(db.blocks))throw Error('Invalid');}catch(e){db=seed()}
    const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){notify('Simpanan peranti tidak tersedia; data mungkin tidak kekal.')}};
    const initialIn=future(23);
    const state={mode:'public',page:'home',searchType:'stay',checkin:initialIn,checkout:offset(initialIn,2),guests:2,eventDate:initialIn,eventGuests:30,filtered:false,adminTab:'overview',adminSearch:'',adminStatus:'all',calMonth:new Date(new Date().getFullYear(),new Date().getMonth(),1),calItem:'all',calDay:today(),modal:null};
    const item=(id)=>listings.find(x=>x.id===id);
    const conflicts=(type,id,start,end)=>{
      if(!start||!end)return false;
      return db.bookings.some(b=>b.type===type&&b.itemId===id&&!['rejected','cancelled'].includes(b.status)&&start<b.end&&end>b.start)
       ||db.blocks.some(b=>b.type===type&&b.itemId===id&&start<b.end&&end>b.start);
    };
    const available=(x)=>!conflicts(x.type,x.id,...(x.type==='stay'?[state.checkin,state.checkout]:[state.eventDate,offset(state.eventDate,1)]));
    const stayQuote=(x,start=state.checkin,end=state.checkout)=>Math.max(0,nights(start,end))*x.price+x.fee;
    const eventQuote=(x,count=state.eventGuests,addons=[])=>x.price+(addons.includes('catering')?35*count:0)+(addons.includes('deco')?450:0)+(addons.includes('audio')?250:0);
    const scrollTop=()=>window.scrollTo({top:0,behavior:'instant'});
    const photo=(x,alt='',extra='')=>`<img src="${esc(x.image)}" alt="${esc(alt||x.name)}" loading="lazy" onerror="this.style.display='none'" ${extra}>`;
    const statusLabel={pending:'Menunggu',confirmed:'Disahkan',rejected:'Ditolak',cancelled:'Dibatalkan'};
    const statusPill=(s)=>`<span class="pill pill-${{pending:'amber',confirmed:'green',rejected:'red',cancelled:'gray'}[s]||'gray'}">${esc(statusLabel[s]||s)}</span>`;
    const navBtn=(page,label)=>`<button class="nav-link ${state.mode==='public'&&state.page===page?'active':''}" data-page="${page}">${label}</button>`;
    function header(){
      $('#site-header').innerHTML=`<div class="container header-inner"><a href="#" class="logo" data-page="home"><span class="logo-mark">R.</span> Ruang<span class="logo-dot">.</span></a><nav class="nav-links" aria-label="Navigasi utama">${navBtn('home','Utama')}${navBtn('stays','Penginapan')}${navBtn('events','Ruang acara')}</nav><div class="header-actions">${state.mode==='admin'?`<button class="btn btn-secondary" data-action="public">${icon('home')} <span class="hide-mobile">Laman pelanggan</span><span class="hide-desktop">Kembali</span></button>`:`<button class="btn btn-secondary" data-action="admin">${icon('chart')} <span class="hide-mobile">Dashboard admin</span><span class="hide-desktop">Admin</span></button>`}</div></div>`;
    }
    const footer=()=>`<footer class="site-footer"><div class="container footer-inner"><div><a href="#" class="logo" data-page="home"><span class="logo-mark">R.</span> Ruang<span class="logo-dot">.</span></a><p>Konsep demo untuk sistem tempahan guesthouse & acara.</p></div><div class="footer-links"><button data-page="stays">Penginapan</button><button data-page="events">Acara</button><button data-action="admin">Dashboard admin</button></div><p>Demo by AzariX Software · Visual: Unsplash · Data rekaan</p></div></footer>`;
    function searchPanel(){
      const isStay=state.searchType==='stay';
      return `<section class="search-panel" id="search-panel"><div class="search-tabs"><button class="search-tab ${isStay?'active':''}" data-action="searchType" data-type="stay">${icon('home')} Tempah penginapan</button><button class="search-tab ${!isStay?'active':''}" data-action="searchType" data-type="event">${icon('spark')} Rancang acara</button></div><form id="search-form" class="search-grid">
      ${isStay?`<div><label class="field-label" for="checkin">Tarikh check-in</label><div class="input-wrap">${icon('calendar')}<input required type="date" id="checkin" name="checkin" min="${today()}" value="${esc(state.checkin)}"></div></div><div><label class="field-label" for="checkout">Tarikh check-out</label><div class="input-wrap">${icon('calendar')}<input required type="date" id="checkout" name="checkout" min="${offset(state.checkin,1)}" value="${esc(state.checkout)}"></div></div><div><label class="field-label" for="guests">Bilangan tetamu</label><div class="input-wrap">${icon('users')}<select id="guests" name="guests">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${state.guests===i+1?'selected':''}>${i+1} orang</option>`).join('')}</select></div></div>`:
      `<div><label class="field-label" for="eventDate">Tarikh acara</label><div class="input-wrap">${icon('calendar')}<input required type="date" id="eventDate" name="eventDate" min="${today()}" value="${esc(state.eventDate)}"></div></div><div><label class="field-label" for="eventGuests">Anggaran kehadiran</label><div class="input-wrap">${icon('users')}<select id="eventGuests" name="eventGuests">${[10,20,30,35,40,50,60,70,80].map(n=>`<option value="${n}" ${state.eventGuests===n?'selected':''}>${n} orang</option>`).join('')}</select></div></div><div><label class="field-label">Jenis tempahan</label><div class="input-wrap">${icon('spark')}<input disabled value="Ruang acara" aria-label="Jenis tempahan"></div></div>`}
      <button type="submit" class="btn btn-primary search-submit">${icon('search')} Semak kekosongan</button></form><p class="error-msg" id="search-error" role="alert"></p></section>`;
    }
    function inventoryCard(x){
      const ok=available(x);const capacity=x.type==='stay'?state.guests:state.eventGuests;
      const enough=capacity<=x.max;
      const isValid=!state.filtered||(ok&&enough);
      const btnText=x.type==='stay'?'Pilih bilik':'Rancang acara';
      return `<article class="inventory-card"><div class="inventory-photo">${photo(x)}<span class="inventory-badge">${esc(x.tag)}</span></div><div class="inventory-body"><div class="location">${icon('pin')}${esc(x.area)}</div><h3 class="inventory-title">${esc(x.name)}</h3><p class="inventory-desc">${esc(x.desc)}</p><div class="inventory-facts">${x.type==='stay'?`<span>${icon('bed')}${x.rooms} bilik</span><span>${icon('users')}Maks. ${x.max} orang</span>`:`<span>${icon('users')}Maks. ${x.max} orang</span><span>${icon('calendar')}Sehari</span>`}</div><div class="inventory-bottom"><div class="inventory-price"><strong>${money(x.price)}</strong><small> / ${x.type==='stay'?'malam':'hari'}</small>${!isValid?`<span class="unavailable-note">${!enough?'Kapasiti tidak mencukupi':'Tarikh sudah ditempah'}</span>`:''}</div><button class="btn ${isValid?'btn-primary':'btn-secondary'}" data-action="book" data-id="${x.id}" ${isValid?'':'disabled'}>${btnText} ${icon('arrow')}</button></div></div></article>`;
    }
    const inventorySection=(type,limit=0)=>{const records=type==='stay'?stays:venues;const shown=limit?records.slice(0,limit):records;return `<section class="showcase" id="${type==='stay'?'stays':'events'}"><div class="section-head"><div><div class="eyebrow">${type==='stay'?'Penginapan pilihan':'Ruang untuk meraikan'}</div><h2>${type==='stay'?'Singgah, rehat, nikmati.':'Setiap majlis ada ceritanya.'}</h2></div><button class="btn btn-minimal" data-page="${type==='stay'?'stays':'events'}">Lihat semua ${icon('arrow')}</button></div><div class="inventory-grid">${shown.map(inventoryCard).join('')}</div></section>`;};

    function listingPage(type){state.searchType=type;state.filtered=true;return `<div class="container view"><div class="page-banner"><div><div class="eyebrow">${type==='stay'?'A collection of calm':'Gatherings worth remembering'}</div><h1>${type==='stay'?'Pilihan penginapan.':'Ruang acara.'}</h1><p>${type==='stay'?'Cari tempat terbaik untuk berehat bersama insan tersayang. Pilih tarikh dan terus hantar tempahan anda.':'Bersama keluarga atau rakan sekerja, setiap pertemuan layak mendapat ruang istimewa.'}</p></div></div><div class="page-filter">${searchPanel()}</div><div class="page-section"><div class="section-head"><div><div class="eyebrow">${type==='stay'?'Penginapan':'Ruang acara'}</div><h2>${type==='stay'?'Yang sesuai dengan anda.':'Cari ruang anda.'}</h2></div><p>Ketersediaan untuk tarikh yang dipilih.</p></div><div class="inventory-grid">${(type==='stay'?stays:venues).map(inventoryCard).join('')}</div></div></div>${footer()}`;}
    function kpi(label,value,sub,ico){return `<div class="kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon(ico)}</span></div><strong>${value}</strong><small>${sub}</small></div>`;}
    function overview(){const confirmed=db.bookings.filter(b=>b.status==='confirmed');const pending=db.bookings.filter(b=>b.status==='pending');const total=confirmed.reduce((sum,b)=>sum+b.total,0);const active=db.bookings.filter(b=>b.status!=='cancelled'&&b.status!=='rejected');return `<div class="admin-kpi-grid">${kpi('Jumlah permohonan',db.bookings.length,'Semua rekod demo','file')}${kpi('Menunggu tindakan',pending.length,'Perlu disemak','clock')}${kpi('Tempahan disahkan',confirmed.length,'Belum bermakna telah dibayar','check')}${kpi('Nilai tempahan',money(total),'Jumlah sebut harga disahkan','chart')}</div><div class="admin-two"><div class="dash-card"><div class="dash-card-title"><h3>Tempahan terkini</h3><button class="btn btn-minimal btn-small" data-tab="bookings">Lihat semua ${icon('arrow')}</button></div>${db.bookings.slice().reverse().slice(0,5).map(b=>`<div class="recent-item"><span class="recent-icon">${icon(b.type==='stay'?'home':'spark')}</span><div class="recent-details"><b>${esc(b.name)}</b><small>${esc(item(b.itemId)?.name||'—')} · ${formatDate(b.start)}</small></div><div class="recent-meta"><b>${money(b.total)}</b>${statusPill(b.status)}</div></div>`).join('')||'<div class="empty-state">Belum ada permohonan.</div>'}</div><div class="dash-card"><div class="dash-card-title"><h3>Tindakan pantas</h3><small>Pengurusan harian</small></div><div class="quick-item">${icon('clock')}<div><b>${pending.length} permohonan untuk disemak</b><p>Sahkan atau tolak permohonan yang masuk.</p><button class="btn btn-minimal btn-small" data-tab="bookings">Semak tempahan ${icon('arrow')}</button></div></div><div class="quick-item">${icon('calendar')}<div><b>Kalendar kekosongan</b><p>Lihat tempahan mengikut tarikh dan sekat tarikh jika perlu.</p><button class="btn btn-minimal btn-small" data-tab="calendar">Buka kalendar ${icon('arrow')}</button></div></div><div class="quick-item">${icon('download')}<div><b>Eksport rekod</b><p>Muat turun rekod demo dalam fail CSV.</p><button class="btn btn-minimal btn-small" data-action="export">Eksport CSV ${icon('arrow')}</button></div></div></div></div><div class="admin-notice">${icon('info')} <span><b>Mod demo:</b> Permohonan dan perubahan disimpan dalam penyemak imbas anda sahaja. Tiada backend, pembayaran sebenar, emel, SMS atau WhatsApp automatik. Gunakan data rekaan ketika menguji sistem ini.</span></div>`;}
    const bookingRows=()=>{const query=state.adminSearch.trim().toLowerCase();const filtered=db.bookings.slice().reverse().filter(b=>(state.adminStatus==='all'||b.status===state.adminStatus)&&[b.id,b.name,b.phone,item(b.itemId)?.name].join(' ').toLowerCase().includes(query));return filtered.length?filtered.map(b=>`<tr><td class="primary-cell"><b>${esc(b.id)}</b><small>${formatDate(b.created)}</small></td><td class="primary-cell"><b>${esc(b.name)}</b><small>${esc(b.phone)}</small></td><td class="primary-cell"><b>${esc(item(b.itemId)?.name||'—')}</b><small>${b.type==='stay'?'Penginapan':'Acara'} · ${b.guests} orang</small></td><td><b>${formatDate(b.start)}</b>${b.type==='stay'?`<br><small>hingga ${formatDate(b.end)}</small>`:''}</td><td><b>${money(b.total)}</b></td><td>${statusPill(b.status)}</td><td><div class="table-actions"><button class="btn btn-secondary btn-small" data-action="detail" data-id="${b.id}">Butiran</button>${b.status==='pending'?`<button class="btn btn-primary btn-small" data-action="confirm" data-id="${b.id}">Sahkan</button><button class="btn btn-secondary btn-small" data-action="reject" data-id="${b.id}">Tolak</button>`:b.status==='confirmed'?`<button class="btn btn-secondary btn-small" data-action="cancel" data-id="${b.id}">Batal</button>`:'<span class="list-flag">—</span>'}</div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty-state"><h3>Tiada tempahan ditemui</h3><p>Cuba kata kunci atau penapis lain.</p></div></td></tr>`;};
    function bookings(){return `<div class="toolbar"><div class="input-wrap">${icon('search')}<input id="admin-search" placeholder="Cari nama, nombor rujukan..." value="${esc(state.adminSearch)}" aria-label="Cari tempahan"></div><select id="admin-status" aria-label="Penapis status"><option value="all">Semua status</option>${Object.entries(statusLabel).map(([k,v])=>`<option value="${k}" ${state.adminStatus===k?'selected':''}>${v}</option>`).join('')}</select><button class="btn btn-secondary btn-small" data-action="export">${icon('download')} Eksport CSV</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Rujukan</th><th>Pelanggan</th><th>Tempat</th><th>Tarikh</th><th>Jumlah</th><th>Status</th><th>Tindakan</th></tr></thead><tbody id="booking-rows">${bookingRows()}</tbody></table></div><p class="table-caption">Tempahan yang berstatus menunggu juga menyekat tarikh bagi mengelakkan permohonan bertindih dalam demo ini.</p>`;}
    const firstOfMonth=(d)=>new Date(d.getFullYear(),d.getMonth(),1);
    const calRecords=(day)=>{let records=db.bookings.filter(b=>!['rejected','cancelled'].includes(b.status)&&b.start<=day&&b.end>day&& (state.calItem==='all'||b.itemId===state.calItem)).map(b=>({type:b.type,label:item(b.itemId)?.name||'',name:b.name,start:b.start,end:b.end}));let blocked=db.blocks.filter(b=>b.start<=day&&b.end>day&&(state.calItem==='all'||b.itemId===state.calItem)).map(b=>({type:'blocked',label:item(b.itemId)?.name||'',name:'Tarikh disekat'}));return [...records,...blocked];};
    function calendar(){const year=state.calMonth.getFullYear(),month=state.calMonth.getMonth(),firstWeekday=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate();let cells='';for(let i=0;i<Math.ceil((firstWeekday+count)/7)*7;i++){let day=i-firstWeekday+1,valid=day>=1&&day<=count,d=new Date(year,month,day),iso=localISO(d),records=valid?calRecords(iso):[];cells+=`<button type="button" class="cal-cell ${valid?'':'inactive'} ${iso===today()?'today':''}" data-action="calDay" data-date="${iso}" aria-label="${formatDate(iso)}${records.length?', '+records.length+' tempahan/sekat':''}"><span class="cal-date">${d.getDate()}</span>${records.slice(0,3).map(r=>`<span class="cal-booking ${r.type==='event'?'event':r.type==='blocked'?'blocked':''}">${esc(r.label)}</span>`).join('')}${records.length>3?`<small style="color:#7d8c84;font-size:9px">+${records.length-3} lagi</small>`:''}</button>`;}
      const selected=calRecords(state.calDay);return `<div class="calendar-head"><h3>${state.calMonth.toLocaleDateString('ms-MY',{month:'long',year:'numeric'})}</h3><div class="calendar-controls"><select id="cal-resource" aria-label="Pilih tempat"><option value="all">Semua tempat</option>${listings.map(x=>`<option value="${x.id}" ${state.calItem===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="cal-nav" data-action="prevMonth" aria-label="Bulan sebelumnya">${icon('chevron')}</button><button class="cal-nav" data-action="nextMonth" aria-label="Bulan seterusnya">${icon('chevron')}</button><button class="btn btn-primary btn-small" data-action="blockModal">${icon('lock')} Sekat tarikh</button></div></div><div class="calendar-wrap"><div class="cal-grid">${['Isn','Sel','Rab','Kha','Jum','Sab','Aha'].map(x=>`<div class="cal-heading">${x}</div>`).join('')}${cells}</div></div><div class="calendar-legend"><span><i></i> Penginapan</span><span><i class="venue-color"></i> Acara</span><span><i class="block-color"></i> Tarikh disekat</span></div><div class="day-details"><h4>${formatDate(state.calDay,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h4>${selected.length?selected.map(r=>`<p>• ${esc(r.label)} — ${esc(r.name)} ${r.type==='event'?'(acara)':r.type==='blocked'?'(disekat)':'(penginapan)'}</p>`).join(''):'<p>Tiada tempahan pada tarikh ini.</p>'}<button class="btn btn-secondary btn-small" data-action="blockModal" data-date="${state.calDay}">${icon('lock')} Sekat tarikh ini</button></div>${db.blocks.length?`<div class="dash-card" style="margin-top:20px"><div class="dash-card-title"><h3>Tarikh yang disekat</h3></div>${db.blocks.map(b=>`<div class="recent-item"><span class="recent-icon">${icon('lock')}</span><div class="recent-details"><b>${esc(item(b.itemId)?.name||'—')}</b><small>${formatDate(b.start)} – ${formatDate(offset(b.end,-1))}</small></div><button class="btn btn-danger btn-small" data-action="unblock" data-id="${b.id}">Buka sekatan</button></div>`).join('')}</div>`:''}`;
    }
    function admin(){const tabs=[['overview','Ringkasan','chart'],['bookings','Tempahan','file'],['calendar','Kalendar','calendar']];let titles={overview:'Selamat datang kembali.',bookings:'Urus tempahan.',calendar:'Kalendar tempahan.'};return `<div class="admin-shell view"><aside class="admin-sidebar"><div class="admin-brand">Ruang.<span>BUSINESS DASHBOARD</span></div><nav class="admin-nav" aria-label="Navigasi dashboard">${tabs.map(([k,v,i])=>`<button data-tab="${k}" class="${state.adminTab===k?'active':''}">${icon(i)}${v}</button>`).join('')}</nav><div class="admin-side-bottom"><strong>Ruang. / Demo</strong>Simulasi pengurusan tempahan, tanpa server atau pembayaran sebenar.</div></aside><section class="admin-main"><div class="admin-topline"><div><span class="eyebrow">RUANG. / PENGURUSAN</span><h1>${titles[state.adminTab]}</h1><p>${state.adminTab==='overview'?'Ringkasan operasi perniagaan anda.':state.adminTab==='bookings'?'Semak permohonan dan kemas kini status pelanggan.':'Semak jadual dan kawal ketersediaan tempat anda.'}</p></div><div class="admin-actions"><button class="btn btn-secondary btn-small" data-action="reset" title="Pulihkan contoh asal">${icon('refresh')} <span class="hide-mobile">Reset demo</span></button></div></div>${state.adminTab==='overview'?overview():state.adminTab==='bookings'?bookings():calendar()}</section></div>`;}
    function render(){header();$('#app').innerHTML=state.mode==='admin'?admin():state.page==='home'?home():listingPage(state.page==='events'?'event':'stay');if(state.modal)renderModal();else $('#modal-root').innerHTML='';}
    function toast(message){let root=$('#toast-root');const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('check')} <span>${esc(message)}</span>`;root.appendChild(el);setTimeout(()=>el.remove(),3600)}

    function openBook(id){const x=item(id);if(!x)return;if(x.type==='stay'){if(!validStay())return; if(state.guests>x.max)return toast('Kapasiti tetamu melebihi had tempat.')}else{if(state.eventDate<today()||state.eventGuests>x.max)return toast('Sila semak tarikh dan kapasiti.')}if(!available(x))return toast('Maaf, tarikh tersebut tidak tersedia. Pilih tarikh lain.');state.modal={kind:'booking',id,addons:[]};renderModal();}

    function bookingModal(){const x=item(state.modal.id),stay=x.type==='stay',count=stay?state.guests:state.eventGuests;const total=stay?stayQuote(x):eventQuote(x,count,state.modal.addons);const d=stay?`${formatDate(state.checkin)} – ${formatDate(state.checkout)}`:formatDate(state.eventDate);return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">PERMOHONAN TEMPAHAN</div><h2 id="modal-title">${stay?'Tempah penginapan':'Rancang majlis anda'}</h2><p>Isi maklumat untuk hantar permohonan demo.</p></div><button class="icon-button" data-action="closeModal" aria-label="Tutup">${icon('close')}</button></div><div class="modal-content"><form id="booking-form" class="modal-grid"><div><div class="form-field"><label for="customerName">Nama penuh *</label><input id="customerName" name="customerName" required maxlength="80" placeholder="Contoh: Nur Aisyah" autocomplete="off"></div><div class="form-two"><div class="form-field"><label for="customerPhone">No. telefon *</label><input id="customerPhone" name="customerPhone" required inputmode="tel" pattern="[+0-9 ()-]{9,20}" maxlength="20" placeholder="012-000 0000" autocomplete="off"></div><div class="form-field"><label for="customerEmail">Emel (pilihan)</label><input id="customerEmail" type="email" name="customerEmail" maxlength="100" placeholder="nama@email.com" autocomplete="off"></div></div>${!stay?`<div class="form-field"><label for="eventKind">Jenis acara</label><select name="eventKind" id="eventKind"><option>Majlis hari jadi</option><option>Majlis pertunangan</option><option>Majlis keluarga</option><option>Program syarikat</option><option>Lain-lain</option></select></div><div class="form-field"><label>Tambah perkhidmatan (pilihan)</label><label class="checkbox-row"><input type="checkbox" name="addons" value="catering" ${state.modal.addons.includes('catering')?'checked':''}> Katering · RM35/orang</label><label class="checkbox-row"><input type="checkbox" name="addons" value="deco" ${state.modal.addons.includes('deco')?'checked':''}> Dekorasi asas · RM450</label><label class="checkbox-row"><input type="checkbox" name="addons" value="audio" ${state.modal.addons.includes('audio')?'checked':''}> Sistem audio · RM250</label></div>`:''}<div class="form-field"><label for="customerNotes">Nota tambahan (pilihan)</label><textarea id="customerNotes" name="customerNotes" maxlength="500" placeholder="Ada permintaan khas?"></textarea></div><p class="notice">${icon('info')} Sila gunakan maklumat rekaan untuk mencuba demo. Tiada emel, WhatsApp atau bayaran sebenar akan dihantar.</p><button class="btn btn-primary btn-full" type="submit">Hantar permohonan ${icon('arrow')}</button></div><aside class="summary-box"><div class="summary-image">${photo(x)}</div><span class="summary-location">${esc(x.area)}</span><div class="summary-name">${esc(x.name)}</div><div class="sum-row"><span>Tarikh</span><b>${d}</b></div><div class="sum-row"><span>Tetamu</span><b>${count} orang</b></div><div class="sum-row"><span>${stay?money(x.price)+' × '+nights(state.checkin,state.checkout)+' malam':'Sewa ruang sehari'}</span><b>${money(stay?x.price*nights(state.checkin,state.checkout):x.price)}</b></div>${stay?`<div class="sum-row"><span>Yuran pembersihan</span><b>${money(x.fee)}</b></div>`:`<div id="addons-summary">${addonRows(state.modal.addons,count)}</div>`}<div class="sum-row total"><span>Jumlah anggaran</span><b id="modal-total">${money(total)}</b></div><p class="sum-deposit" id="modal-deposit">Deposit cadangan 30%: ${money(Math.ceil(total*.3))}. Bayaran tidak diproses dalam demo.</p></aside></form></div></div>`;}
    function addonRows(addons,count){return `${addons.includes('catering')?`<div class="sum-row"><span>Katering × ${count}</span><b>${money(count*35)}</b></div>`:''}${addons.includes('deco')?`<div class="sum-row"><span>Dekorasi</span><b>${money(450)}</b></div>`:''}${addons.includes('audio')?`<div class="sum-row"><span>Audio</span><b>${money(250)}</b></div>`:''}`;}
    function updateAddons(){if(state.modal?.kind!=='booking')return;const x=item(state.modal.id);if(x.type!=='event')return;const boxes=[...document.querySelectorAll('input[name="addons"]:checked')];state.modal.addons=boxes.map(x=>x.value);const total=eventQuote(x,state.eventGuests,state.modal.addons);$('#addons-summary').innerHTML=addonRows(state.modal.addons,state.eventGuests);$('#modal-total').textContent=money(total);$('#modal-deposit').textContent=`Deposit cadangan 30%: ${money(Math.ceil(total*.3))}. Bayaran tidak diproses dalam demo.`;}
    function successModal(){const b=state.modal.record;return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">PERMOHONAN DITERIMA</div></div><button class="icon-button" data-action="closeModal" aria-label="Tutup">${icon('close')}</button></div><div class="modal-content"><div class="success-pane"><span class="success-mark">${icon('check')}</span><h2 id="modal-title">Terima kasih!</h2><p>Permohonan demo untuk <b>${esc(item(b.itemId)?.name||'tempat')}</b> telah direkodkan. Status: <b>Menunggu pengesahan admin</b>.</p><div class="reference-code">${esc(b.id)}</div><div class="success-buttons"><button class="btn btn-secondary" data-action="copyRef" data-id="${esc(b.id)}">Salin rujukan</button><button class="btn btn-primary" data-action="admin">Lihat di dashboard ${icon('arrow')}</button></div></div></div></div>`;}
    function detailModal(){const b=db.bookings.find(x=>x.id===state.modal.id);if(!b)return '';const x=item(b.itemId);const addNames={catering:'Katering',deco:'Dekorasi asas',audio:'Sistem audio'};const fields=[['Pelanggan',b.name],['Telefon',b.phone],['Emel',b.email||'—'],['Tempat',x?.name||'—'],['Tarikh mula',formatDate(b.start)],...(b.type==='stay'?[['Check-out',formatDate(b.end)]]:[]),['Bilangan tetamu',b.guests+' orang'],...(b.type==='event'?[['Jenis acara',b.eventType||'—'],['Tambahan',(b.addons||[]).map(a=>addNames[a]||a).join(', ')||'Tiada']]:[]),['Jumlah anggaran',money(b.total)],['Deposit cadangan (30%)',money(b.deposit)],['Nota',b.notes||'Tiada']];return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">BUTIRAN PERMOHONAN</div><h2 id="modal-title">${esc(b.id)}</h2><p>${b.type==='stay'?'Penginapan':'Ruang acara'} · ${formatDate(b.created)}</p></div><button class="icon-button" data-action="closeModal" aria-label="Tutup">${icon('close')}</button></div><div class="modal-content"><div style="margin-bottom:18px">${statusPill(b.status)}</div>${fields.map(([key,val])=>`<div class="sum-row" style="padding:9px 0;border-bottom:1px solid #edf0ed"><span>${esc(key)}</span><b style="text-align:right;max-width:62%;overflow-wrap:anywhere">${esc(val)}</b></div>`).join('')}<p class="notice">${icon('info')} Semua maklumat dan status di sini hanya untuk demo dalam penyemak imbas anda.</p><button class="btn btn-secondary btn-full" data-action="closeModal">Tutup butiran</button></div></div>`;}
    function blockModal(){return `<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">KALENDAR ADMIN</div><h2 id="modal-title">Sekat tarikh</h2><p>Tarikh yang disekat tidak boleh ditempah.</p></div><button class="icon-button" data-action="closeModal" aria-label="Tutup">${icon('close')}</button></div><div class="modal-content"><form id="block-form"><div class="form-field"><label for="block-item">Pilih penginapan / ruang acara</label><select id="block-item" name="blockItem" required>${listings.map(x=>`<option value="${x.id}" ${state.calItem===x.id?'selected':''}>${esc(x.name)} (${x.type==='stay'?'Penginapan':'Acara'})</option>`).join('')}</select></div><div class="form-two"><div class="form-field"><label for="block-start">Dari tarikh</label><input type="date" id="block-start" name="blockStart" min="${today()}" value="${state.modal.date>=today()?state.modal.date:today()}" required></div><div class="form-field"><label for="block-end">Hingga tarikh (termasuk)</label><input type="date" id="block-end" name="blockEnd" min="${today()}" value="${state.modal.date>=today()?state.modal.date:today()}" required></div></div><p class="notice">${icon('info')} Sekatan akan kelihatan pada kalendar. Tempahan sedia ada tidak akan diubah.</p><button class="btn btn-primary btn-full" type="submit">${icon('lock')} Simpan sekatan</button></form></div></div>`;}
    function renderModal(){document.body.style.overflow='hidden';$('#modal-root').innerHTML=`<div class="modal-layer" data-overlay="true">${state.modal.kind==='booking'?bookingModal():state.modal.kind==='success'?successModal():state.modal.kind==='detail'?detailModal():blockModal()}</div>`;const first=$('#modal-root input:not([type=hidden]),#modal-root select');if(first&&state.modal.kind!=='success')setTimeout(()=>first.focus({preventScroll:true}),0);}
    function closeModal(){state.modal=null;$('#modal-root').innerHTML='';document.body.style.overflow='';}
    function submitBooking(form){const x=item(state.modal.id);if(!x)return;const formData=new FormData(form),stay=x.type==='stay',start=stay?state.checkin:state.eventDate,end=stay?state.checkout:offset(state.eventDate,1),count=stay?state.guests:state.eventGuests;
      if(start<today()||(stay&&!validStay())||count>x.max){toast('Tarikh atau bilangan tetamu tidak sah.');return}
      if(conflicts(x.type,x.id,start,end)){toast('Tarikh ini baru ditempah / disekat. Sila pilih tarikh lain.');return}
      const name=String(formData.get('customerName')||'').trim(),phone=String(formData.get('customerPhone')||'').trim(),email=String(formData.get('customerEmail')||'').trim();if(!name||!/^[+0-9 ()-]{9,20}$/.test(phone)){toast('Semak nama dan nombor telefon.');return}
      const addons=stay?[]:formData.getAll('addons');const total=stay?stayQuote(x):eventQuote(x,count,addons);
      const b={id:uid(),type:x.type,itemId:x.id,start,end,name,phone,email,guests:count,total,deposit:Math.ceil(total*.3),status:'pending',created:today(),notes:String(formData.get('customerNotes')||'').slice(0,500),...(stay?{}:{eventType:String(formData.get('eventKind')||''),addons})};db.bookings.push(b);persist();state.modal={kind:'success',record:b};renderModal();}
    function submitBlock(form){const v=new FormData(form),it=item(v.get('blockItem')),start=String(v.get('blockStart')),last=String(v.get('blockEnd'));if(!it||start<today()||last<start||nights(start,offset(last,1))>90){toast('Sila semak julat tarikh (maksimum 90 hari).');return}db.blocks.push({id:uid(),type:it.type,itemId:it.id,start,end:offset(last,1)});persist();closeModal();render();toast('Tarikh berjaya disekat.');}
    function changeStatus(id,status){const b=db.bookings.find(x=>x.id===id);if(!b)return;if(status==='confirmed'&&b.status!=='pending')return;if(status==='rejected'&&b.status!=='pending')return;if(status==='cancelled'&&b.status!=='confirmed')return;b.status=status;persist();render();toast(`Status tempahan dikemas kini: ${statusLabel[status]}.`)}
    function exportCSV(){const headers=['Rujukan','Kategori','Tempat','Nama','Telefon','Emel','Mula','Tamat','Tetamu','Jumlah RM','Deposit RM','Status','Nota'];const safe=(v)=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const rows=db.bookings.map(b=>[b.id,b.type,item(b.itemId)?.name,b.name,b.phone,b.email,b.start,b.end,b.guests,b.total,b.deposit,statusLabel[b.status],b.notes]);const text='\ufeff'+[headers,...rows].map(row=>row.map(safe).join(',')).join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ruang-tempahan-demo-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV demo telah dimuat turun.');}
    function doSearch(form){const v=new FormData(form),isStay=state.searchType==='stay';if(isStay){const a=String(v.get('checkin')),b=String(v.get('checkout'));if(a<today()||b<=a||nights(a,b)>30){const el=$('#search-error');el.textContent='Sila pilih tarikh yang sah (1–30 malam).';el.classList.add('show');return}state.checkin=a;state.checkout=b;state.guests=Number(v.get('guests'));}else{const d=String(v.get('eventDate'));if(d<today()){const el=$('#search-error');el.textContent='Sila pilih tarikh acara yang sah.';el.classList.add('show');return}state.eventDate=d;state.eventGuests=Number(v.get('eventGuests'));}state.filtered=true;state.page=isStay?'stays':'events';render();scrollTop();toast('Kekosongan telah disemak untuk tarikh pilihan.');}
    function navigate(page){state.mode='public';state.page=page;state.filtered=page!=='home';state.modal=null;document.body.style.overflow='';render();scrollTop()}
    document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();doSearch(e.target)}else if(e.target.id==='booking-form'){e.preventDefault();submitBooking(e.target)}else if(e.target.id==='block-form'){e.preventDefault();submitBlock(e.target)}});
    document.addEventListener('change',e=>{if(e.target.matches('input[name="addons"]'))updateAddons();if(e.target.id==='admin-status'){state.adminStatus=e.target.value;$('#booking-rows').innerHTML=bookingRows()}if(e.target.id==='cal-resource'){state.calItem=e.target.value;render()}if(e.target.id==='checkin'){const check=e.target.value;const out=$('#checkout');if(out){out.min=offset(check,1);if(out.value<=check)out.value=offset(check,1)}}});
    document.addEventListener('input',e=>{if(e.target.id==='admin-search'){state.adminSearch=e.target.value;$('#booking-rows').innerHTML=bookingRows()}});
    document.addEventListener('click',async e=>{if(e.target.classList.contains('modal-layer')){closeModal();return}const node=e.target.closest('[data-page],[data-tab],[data-action]');if(!node||node.disabled)return;
      if(node.dataset.page){e.preventDefault();navigate(node.dataset.page);return}if(node.dataset.tab){state.adminTab=node.dataset.tab;render();scrollTop();return}const action=node.dataset.action,id=node.dataset.id;
      if(action==='searchType'){state.searchType=node.dataset.type;const panel=$('#search-panel');if(panel){const wrapper=panel.parentElement;if(wrapper&&wrapper.classList.contains('page-filter')){navigate(state.searchType==='stay'?'stays':'events')}else{panel.outerHTML=searchPanel()}}return}
      if(action==='admin'){closeModal();state.mode='admin';state.adminTab='overview';render();scrollTop();return}if(action==='public'){navigate('home');return}
      if(action==='book'){openBook(id);return}if(action==='closeModal'){closeModal();return}
      if(action==='detail'){state.modal={kind:'detail',id};renderModal();return}if(action==='confirm'){changeStatus(id,'confirmed');return}if(action==='reject'){changeStatus(id,'rejected');return}if(action==='cancel'){if(confirm('Batalkan tempahan ini?'))changeStatus(id,'cancelled');return}
      if(action==='copyRef'){try{await navigator.clipboard.writeText(id);toast('Nombor rujukan disalin.')}catch(err){toast('Salin nombor rujukan yang dipaparkan secara manual.')}return}
      if(action==='export'){exportCSV();return}if(action==='reset'){if(confirm('Pulihkan semua data contoh? Tempahan demo yang anda tambah akan dipadam pada peranti ini.')){db=seed();persist();state.adminSearch='';state.adminStatus='all';render();toast('Data demo dipulihkan.')}return}
      if(action==='prevMonth'||action==='nextMonth'){state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+(action==='nextMonth'?1:-1),1);render();return}
      if(action==='calDay'){state.calDay=node.dataset.date;render();return}
      if(action==='blockModal'){state.modal={kind:'block',date:node.dataset.date||state.calDay};renderModal();return}
      if(action==='unblock'){db.blocks=db.blocks.filter(b=>b.id!==id);persist();render();toast('Sekatan tarikh dibuka.');return}
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
    persist();render();
  })();
  </script>
</body>
